<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSX Value List</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #e2e8f0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    font-size: 2.5em;
    color: #00d4ff;
    margin-bottom: 5px;
    text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
}

header p {
    color: #a0aec0;
    font-size: 1em;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
}

.controls {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 30px;
    align-items: center;
}

#search {
    width: 100%;
    max-width: 550px;
    padding: 12px 16px;
    border-radius: 8px;
    border: 2px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 16px;
    transition: border-color 0.3s;
}

#search:focus {
    outline: none;
    border-color: #00d4ff;
}

.filter-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

.filter-btn {
    padding: 10px 20px;
    border: 2px solid #334155;
    border-radius: 25px;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.filter-btn:hover {
    border-color: #00d4ff;
    color: #00d4ff;
}

.filter-btn.active {
    background: #00d4ff;
    color: #000;
    border-color: #00d4ff;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}

.card {
    background: linear-gradient(135deg, #2d1b4e 0%, #1a0f2e 100%);
    border: 2px solid #4a2a7f;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.3s ease;
    cursor: pointer;
}

.card:hover {
    border-color: #00d4ff;
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
}

.card-image {
    width: 100%;
    height: 150px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3em;
    border-bottom: 2px solid #4a2a7f;
    overflow: hidden;
}

.card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.card-content {
    padding: 16px;
}

.card-title {
    font-size: 1.2em;
    font-weight: 600;
    color: #00d4ff;
    margin-bottom: 12px;
}

.value-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #334155;
    font-size: 0.9em;
}

.value-row:last-child {
    border-bottom: none;
}

.value-type {
    text-transform: uppercase;
    font-weight: 600;
    font-size: 0.8em;
    letter-spacing: 1px;
}

.normal {
    color: #94a3b8;
}

.golden {
    color: #fbbf24;
}

.rainbow {
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.value-amount {
    font-family: 'Courier New', monospace;
    font-weight: 600;
}

.na-value {
    color: #f87171;
    font-style: italic;
}

.no-results {
    text-align: center;
    padding: 60px 20px;
    color: #94a3b8;
    font-size: 1.1em;
}

.stats {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

.stat-card {
    background: linear-gradient(135deg, #2d1b4e 0%, #1a0f2e 100%);
    padding: 20px;
    border-radius: 8px;
    border-left: 4px solid #00d4ff;
    flex: 1;
    min-width: 200px;
    text-align: center;
}

.stat-card h3 {
    color: #94a3b8;
    font-size: 0.9em;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.stat-card .number {
    font-size: 2em;
    font-weight: bold;
    color: #00d4ff;
}

.footer {
    text-align: center;
    padding: 30px 20px;
    color: #64748b;
    font-size: 0.9em;
}

@media (max-width: 768px) {
    header h1 {
        font-size: 1.8em;
    }

    .grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
    }

    #search {
        max-width: 100%;
    }

    .filter-buttons {
        gap: 8px;
    }

    .filter-btn {
        padding: 8px 16px;
        font-size: 0.9em;
    }
}
</style>
</head>

<body>

<header>
<h1>💎 PSX Value List</h1>
<p>Huge Creatures Value List</p>
</header>

<div class="container">

<div class="controls">
<input type="text" id="search" placeholder="🔍 Search pets..." onkeyup="filterCards()">
<div class="filter-buttons">
<button class="filter-btn active" onclick="filterByCategory('all')">All Pets</button>
<button class="filter-btn" onclick="filterByCategory('exclusive')">Exclusive</button>
</div>
</div>

<div class="grid" id="grid">
<!-- Cards will be populated by JavaScript -->
</div>

<div id="noResults" class="no-results" style="display:none;">
No pets found. Try adjusting your search.
</div>

</div>

<div class="footer">
<p>📝 Community-made PSX Value Guide</p>
<p>Values are approximate and may vary based on demand</p>
</div>

<script>
const petsData = [
    // Exclusive
    { name: "Huge Avenging Griffin", emoji: "🦅", category: "exclusive", normal: "800M - 1.3B", golden: "1.8B - 2.8B", rainbow: "3.5B - 5.5B" },
    { name: "Huge Bull", emoji: "🐂", category: "exclusive", normal: "600M - 900M", golden: "1.4B - 2.2B", rainbow: "2.8B - 4.5B" },
    { name: "Huge Angelus", emoji: "😇", category: "exclusive", normal: "600M - 900M", golden: "1.4B - 2.2B", rainbow: "2.8B - 4.5B" },
    { name: "Huge Demon", emoji: "😈", category: "exclusive", normal: "N/A", golden: "N/A", rainbow: "N/A" },
    { name: "Huge Hell Rock", emoji: "🪨", category: "exclusive", normal: "450M - 750M", golden: "1.1B - 1.7B", rainbow: "2.2B - 3.8B" },
    { name: "Huge Angel Cat", emoji: "😸", category: "exclusive", normal: "450M - 750M", golden: "1.1B - 1.7B", rainbow: "2.2B - 3.8B" },
    { name: "Huge Hellbound", emoji: "🔥", category: "exclusive", normal: "420M - 750M", golden: "1.1B - 1.7B", rainbow: "2.2B - 3.5B" },
    { name: "Huge Storm Agony", emoji: "⚡", category: "exclusive", normal: "600M - 700M", golden: "1B - 1.6B", rainbow: "2B - 3.5B" },
    { name: "Huge Pog Cat", emoji: "🐱", category: "exclusive", normal: "N/A", golden: "N/A", rainbow: "N/A" },
    { name: "Huge Phantom Wolf", emoji: "👻", category: "exclusive", normal: "N/A", golden: "N/A", rainbow: "N/A" },
    { name: "Huge Mushroom King", emoji: "🍄", category: "exclusive", normal: "N/A", golden: "N/A", rainbow: "N/A" },
    
    // Regular
    { name: "Huge Pegasus", emoji: "🐴", category: "regular", normal: "350M - 650M", golden: "800M - 1.3B", rainbow: "1.5B - 2.8B" },
    { name: "Huge Easter Bunny", emoji: "🐰", category: "regular", normal: "300M - 600M", golden: "800M - 1.3B", rainbow: "1.3B - 2.5B" },
    { name: "Huge Cupcake", emoji: "🧁", category: "regular", normal: "300M - 600M", golden: "700M - 1.2B", rainbow: "1.3B - 2.5B" },
    { name: "Huge Turtle", emoji: "🐢", category: "regular", normal: "300M - 600M", golden: "700M - 1.2B", rainbow: "1.3B - 2.5B" },
    { name: "Huge Corgi", emoji: "🐕", category: "regular", normal: "280M - 550M", golden: "650M - 1.1B", rainbow: "1.2B - 2.3B" },
    { name: "Huge Cat", emoji: "🐱", category: "regular", normal: "250M - 500M", golden: "600M - 1B", rainbow: "1.1B - 2.2B" },
    { name: "Huge Dragon", emoji: "🐉", category: "regular", normal: "320M - 620M", golden: "750M - 1.3B", rainbow: "1.4B - 2.8B" },
    { name: "Huge Phoenix", emoji: "🔥", category: "regular", normal: "290M - 580M", golden: "700M - 1.2B", rainbow: "1.3B - 2.6B" },
    { name: "Huge Unicorn", emoji: "🦄", category: "regular", normal: "270M - 550M", golden: "650M - 1.1B", rainbow: "1.2B - 2.4B" },
    { name: "Huge Angel", emoji: "😇", category: "regular", normal: "260M - 520M", golden: "630M - 1.1B", rainbow: "1.2B - 2.3B" },
    { name: "Huge Demon Fox", emoji: "🦊", category: "regular", normal: "240M - 480M", golden: "580M - 1B", rainbow: "1.1B - 2.2B" },
    { name: "Huge Galaxy Wolf", emoji: "🐺", category: "regular", normal: "300M - 600M", golden: "700M - 1.2B", rainbow: "1.3B - 2.5B" },
];

let currentCategory = 'all';
let currentData = [...petsData];

function populateCards() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    
    if (currentData.length === 0) {
        document.getElementById('noResults').style.display = 'block';
        return;
    }
    
    document.getElementById('noResults').style.display = 'none';
    
    currentData.forEach(pet => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const isNA = pet.normal === 'N/A';
        const normalClass = isNA ? 'na-value' : 'normal';
        const goldenClass = isNA ? 'na-value' : 'golden';
        const rainbowClass = isNA ? 'na-value' : 'rainbow';
        
        card.innerHTML = `
            <div class="card-image">${pet.emoji}</div>
            <div class="card-content">
                <div class="card-title">${pet.name}</div>
                <div class="value-row">
                    <span class="value-type normal">NORMAL</span>
                    <span class="value-amount ${normalClass}">${pet.normal}</span>
                </div>
                <div class="value-row">
                    <span class="value-type golden">GOLDEN</span>
                    <span class="value-amount ${goldenClass}">${pet.golden}</span>
                </div>
                <div class="value-row">
                    <span class="value-type rainbow">RAINBOW</span>
                    <span class="value-amount ${rainbowClass}">${pet.rainbow}</span>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function filterByCategory(category) {
    currentCategory = category;
    
    // Update active button
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    event.target.classList.add('active');
    
    // Filter data
    if (category === 'all') {
        currentData = [...petsData];
    } else {
        currentData = petsData.filter(pet => pet.category === category);
    }
    
    // Reset search
    document.getElementById('search').value = '';
    populateCards();
}

function filterCards() {
    const searchInput = document.getElementById('search').value.toLowerCase();
    
    if (currentCategory === 'all') {
        currentData = petsData.filter(pet => 
            pet.name.toLowerCase().includes(searchInput)
        );
    } else {
        currentData = petsData.filter(pet => 
            pet.category === currentCategory && pet.name.toLowerCase().includes(searchInput)
        );
    }
    
    populateCards();
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    populateCards();
});
</script>

</body>
</html>
